<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We're updating our website</title>
<style>
  :root {
    --bg: #08090c;
    --ink: #f3efe6;
    --muted: #a7abb5;
    --gear: #c8323c;
    --gear2: #6b707c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 50% 38%, rgba(200,50,60,.22), transparent 45%),
      radial-gradient(circle at 15% 90%, rgba(90,100,130,.18), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(200,50,60,.10), transparent 35%),
      var(--bg);
    background-attachment: fixed;
    overflow: hidden;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  main { max-width: 520px; }
  .gears { position: relative; width: 200px; height: 150px; margin: 0 auto 32px; }
  .gear { position: absolute; }
  .g1 { width: 110px; height: 110px; left: 10px; top: 10px; color: var(--gear); animation: spin 6s linear infinite; }
  .g2 { width: 80px; height: 80px; left: 105px; top: 62px; color: var(--gear2); animation: spin 6s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.15; margin-bottom: 14px; }
  p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  .dots span { display: inline-block; animation: hop 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
  .bar { height: 6px; width: 240px; max-width: 80%; margin: 30px auto 0; background: #22252d; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--gear); border-radius: 3px; animation: slide 1.8s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

  .logo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 28px;
    border: 3px solid #c8323c; box-shadow: 0 0 0 6px rgba(200,50,60,.15), 0 0 40px rgba(200,50,60,.45);
    animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(200,50,60,.08), 0 0 60px rgba(200,50,60,.7); } }
  .gears { transform: scale(.6); margin: -20px auto 0 !important; }
  .brand { font-size: 1.5rem; font-weight: 700; letter-spacing: .04em; margin: -14px 0 26px; color: var(--ink); }
  main { position: relative; z-index: 1; }
  #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #fx i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0;
    animation: rise linear infinite; }
  #fx i.r { background: #ff4b57; box-shadow: 0 0 8px #ff4b57; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-105vh) translateX(30px); opacity: 0; } }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); }
  @media (prefers-reduced-motion: reduce) {
    .gear, .dots span, .bar i, .logo, #fx i { animation: none; }
  }
</style>
</head>
